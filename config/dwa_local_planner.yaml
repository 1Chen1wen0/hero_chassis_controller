DWAPlannerROS:
  acc_lim_x: 1.5
  acc_lim_y: 1.5
  acc_lim_theta: 3.0

  max_vel_trans: 0.8
  min_vel_trans: 0.05
  max_vel_x: 0.8
  min_vel_x: -0.4
  max_vel_y: 0.8
  min_vel_y: -0.8
  max_vel_theta: 1.5
  min_vel_theta: 0.2

  xy_goal_tolerance: 0.10
  yaw_goal_tolerance: 0.08
  latch_xy_goal_tolerance: false

  sim_time: 1.7
  sim_granularity: 0.025
  angular_sim_granularity: 0.025
  vx_samples: 12
  vy_samples: 12
  vth_samples: 24
  controller_frequency: 10.0

  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.03
  forward_point_distance: 0.20
  stop_time_buffer: 0.20
  scaling_speed: 0.25
  max_scaling_factor: 0.20

  oscillation_reset_dist: 0.15
  prune_plan: true
  penalize_negative_x: false
  publish_traj_pc: true
  publish_cost_grid_pc: true
